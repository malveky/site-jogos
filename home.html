<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home- 🎮Game Zone </title>]

    <style>
        body{
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #121212;
            color: white;
        }
        header{
            background-color: #1e1e1e;
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid #00ff99;

        header h1{

         }

            justify-content: center;

            flex-wrap: wrap;
            padding: 20px;
         }

      .card{

      }

        border-radius: 10px;

     }
     .card h3{
        color: #00ff99;
     }

     footer{
        text-align: center;
        padding: 20px;
        margin-top: 30px;
        background-color: #1e1e1e;
     }

</head>
